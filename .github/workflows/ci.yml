name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mpira
          POSTGRES_USER: mpira
          POSTGRES_PASSWORD: mpira
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpira"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mpira:mpira@localhost:5432/mpira
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django checks
        run: python manage.py check

      - name: Production settings boot
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: ci-only-long-random-looking-secret-key-1234567890
          ALLOWED_HOSTS: example.com

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (PostgreSQL)
        run: python manage.py test
